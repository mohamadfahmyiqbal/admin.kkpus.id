name: CI/CD Vite React to VPS

on:
  push:
    branches: [ "master", "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Copy files to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}   # Menggunakan password VPS
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222                    # <-- WAJIB: Mengarah ke port 2222, bukan 22
          source: "dist/*"
          target: "/var/www/admin.kkpus.id"
          strip_components: 1