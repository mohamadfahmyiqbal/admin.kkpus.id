name: CI/CD Vite React to VPS (admin.kkpus.id)

on:
  push:
    branches: [ "master", "main", "rollback/**" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # CI STAGE: Lint, Test, Audit, Security
  # ============================================
  ci:
    name: CI - Lint, Test, Audit, Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for gitleaks

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (ci)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm run test:ci 2>&1 || true  # Non-blocking until tests are added (M6)

      - name: Run npm audit (non-blocking - tracked in M5)
        run: |
          echo "⚠️ npm audit results (non-blocking until M5):"
          npm audit --audit-level=high 2>&1 || true

      - name: Upload coverage (if tests pass)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ============================================
  # DEPLOY STAGE: Only on branch push (not PR)
  # ============================================
  deploy:
    name: Deploy to VPS
    needs: ci
    if: github.event_name == 'push' && github.repository == 'mohamadfahmyiqbal/admin.kkpus.id'
    runs-on: ubuntu-latest
    environment:
      name: VPS_ADMIN
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add remote host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy dist to VPS
        run: |
          BRANCH="${GITHUB_REF##*/}"
          echo "Deploying branch: $BRANCH"
          rsync -avz --delete -e "ssh -p 2222" dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/admin.kkpus.id/

          # Post-deploy verification
          echo "Running post-deploy verification..."
          sleep 3
          ssh -p 2222 -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            # Verify the deployment directory exists and has content
            if [ -d "/var/www/admin.kkpus.id" ] && [ "$(ls -A /var/www/admin.kkpus.id)" ]; then
              echo "✅ Deployment directory verified"
            else
              echo "❌ Deployment directory empty or missing"
              exit 1
            fi
          EOF

