name: Deploy Admin Portal to Production VPS

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: PRODUCTION_VPS_ADMIN

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci --production

      - name: Build application
        run: npm run build

      - name: Configure environment variables
        run: |
          export PORT=3001
          export NODE_ENV=development

      - name: Deploy to VPS
        env:
          VPS_USER: kkpusid
          VPS_PASS: qwerty123!!
          VPS_PORT: 2222
        run: |
          echo "Port: $VPS_PORT"
          echo "Username: $VPS_USER"
          echo "Host: kkpus.id"

          sshpass -p "$VPS_PASS" ssh -p $VPS_PORT -o StrictHostKeyChecking=no $VPS_USER@kkpus.id << 'EOF'
            cd /var/www/admin.kkpus.id
            git fetch origin master
            git reset --hard origin/master
            npm install --production

            # Restart app using PM2 or npx fallback
            if command -v pm2 &> /dev/null; then
              pm2 reload app || pm2 restart app
            else
              npx pm2 reload app || npx pm2 restart app
            fi
          EOF
